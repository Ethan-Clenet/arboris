name: Pa11y CI (axe)

# Repo privé : pas de minutes Actions gratuites une fois la limite atteinte.
# Lancer à la main si besoin (Actions → Pa11y CI → Run workflow).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL de base à auditer (prod, preview…)'
        required: false
        default: 'https://arboristhree.xyz'

concurrency:
  group: pa11y-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pa11y:
    name: Pa11y axe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Pa11y CI (axe / WCAG2AA)
        run: npm run a11y:ci
        env:
          PA11Y_BASE_URL: ${{ inputs.base_url || 'https://arboristhree.xyz' }}

      - name: Upload Pa11y reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-reports
          path: pa11y-reports/
          retention-days: 30
          if-no-files-found: warn
