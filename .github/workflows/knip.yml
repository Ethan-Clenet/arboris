name: Knip

# Repo privé : pas de minutes Actions gratuites une fois la limite atteinte.
# Lancer à la main si besoin (Actions → Knip → Run workflow).
on:
  workflow_dispatch:

concurrency:
  group: knip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    name: Unused code & deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run knip (files + dependencies)
        run: npm run knip:ci
