name: SonarCloud

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarcloud.yml'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - 'src/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarcloud.yml'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Tests (coverage)
        run: npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=text-summary

      - name: SonarCloud Scan
        id: sonar
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # L’API ALM show_pullrequest renvoie parfois 500 si l’app GitHub
      # SonarCloud ne peut pas lire la PR. On republie alors en analyse de branche.
      - name: SonarCloud Scan (branche)
        if: steps.sonar.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: push
        with:
          args: >
            -Dsonar.branch.name=${{ github.head_ref || github.ref_name }}
