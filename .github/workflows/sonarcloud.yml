name: SonarCloud

# Repo privé : pas de minutes Actions gratuites une fois la limite atteinte.
# Lancer à la main si besoin (Actions → SonarCloud → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Tests (coverage)
        run: npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=text-summary

      # CI et Automatic Analysis sont mutuellement exclusifs.
      # https://sonarcloud.io/project/analysis_method?id=ThePheniX974_arboris
      - name: Disable SonarCloud Automatic Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::Secret SONAR_TOKEN manquant."
            exit 1
          fi
          code=$(curl -sS -o /tmp/sonar-autoscan.json -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "enable=false&projectKey=ThePheniX974_arboris&organization=thephenix974" \
            "https://sonarcloud.io/api/autoscan/activation")
          echo "autoscan/activation HTTP ${code}"
          cat /tmp/sonar-autoscan.json || true
          echo
          if [ "${code}" -ge 400 ]; then
            echo "::warning::API autoscan/activation HTTP ${code}. Si le scan échoue, désactive Automatic Analysis ici : https://sonarcloud.io/project/analysis_method?id=ThePheniX974_arboris"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
