name: SonarCloud

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarcloud.yml'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - 'src/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarcloud.yml'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Tests (coverage)
        run: npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=text-summary

      # CI et Automatic Analysis sont mutuellement exclusifs.
      # https://sonarcloud.io/project/analysis_method?id=ThePheniX974_arboris
      - name: Disable SonarCloud Automatic Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::Secret SONAR_TOKEN manquant."
            exit 1
          fi
          code=$(curl -sS -o /tmp/sonar-autoscan.json -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "enable=false&projectKey=ThePheniX974_arboris&organization=thephenix974" \
            "https://sonarcloud.io/api/autoscan/activation")
          echo "autoscan/activation HTTP ${code}"
          cat /tmp/sonar-autoscan.json || true
          echo
          if [ "${code}" -ge 400 ]; then
            echo "::warning::API autoscan/activation HTTP ${code}. Si le scan échoue, désactive Automatic Analysis ici : https://sonarcloud.io/project/analysis_method?id=ThePheniX974_arboris"
          fi

      # Sur une PR, l’API ALM show_pullrequest échoue (projet BOUND mais
      # l’app GitHub ne lit pas la PR). On analyse la branche plutôt que
      # d’échouer le premier step (annotation rouge) puis de replier.
      - name: SonarCloud Scan
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud Scan (branche)
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: push
        with:
          args: >
            -Dsonar.branch.name=${{ github.head_ref }}
