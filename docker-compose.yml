services:
  postgres:
    image: postgres:16-alpine
    container_name: arboris-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: arboris
      POSTGRES_PASSWORD: arboris
      POSTGRES_DB: arboris
    volumes:
      - arboris_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arboris -d arboris"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  arboris_pg_data:
