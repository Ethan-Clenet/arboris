# SonarQube Cloud — org thephenix974
# Scope volontairement étroit : Free = 50k LoC max.
# prisma/skills ≈ 500k+ lignes → JAMAIS dans le scan.

sonar.organization=thephenix974
sonar.projectKey=ThePheniX974_arboris
sonar.projectName=Arboris

# Uniquement le code app — pas cli/scripts/packages/skills
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.{test,spec}.{ts,tsx}

sonar.inclusions=**/*.{ts,tsx,css}

sonar.exclusions=\
**/node_modules/**,\
**/*.{test,spec}.{ts,tsx},\
**/generated/**

sonar.coverage.exclusions=\
**/*.{test,spec}.{ts,tsx},\
**/generated/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
