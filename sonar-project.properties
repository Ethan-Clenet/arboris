# SonarQube Cloud — org Rubix0270 (key: thephenix974)
# Confirme projectKey dans SonarCloud → Project Information après import du repo.

sonar.organization=thephenix974
sonar.projectKey=thephenix974_arboris
sonar.projectName=Arboris

sonar.sources=src,cli,scripts,packages
sonar.tests=src
sonar.test.inclusions=**/*.{test,spec}.{ts,tsx,js,mjs}

# Skills vendors + artefacts : hors scope (bruit / taille)
sonar.exclusions=\
**/node_modules/**,\
**/.output/**,\
**/dist/**,\
**/.vercel/**,\
**/.nitro/**,\
**/prisma/skills/**,\
**/prisma/skillspector-reports/**,\
**/pa11y-reports/**,\
**/.lighthouseci/**,\
**/coverage/**,\
**/public/**

sonar.coverage.exclusions=\
**/scripts/**,\
**/cli/**,\
**/*.{test,spec}.{ts,tsx,js,mjs}

# Coverage Vitest (si générée en CI)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
