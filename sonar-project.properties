# SonarQube Cloud — org thephenix974
# Scope volontairement étroit : Free = 50k LoC max.
# prisma/skills ≈ 500k+ lignes → JAMAIS dans le scan.
#
# Automatic Analysis doit rester OFF (Administration → Analysis Method)
# sinon le scan CI échoue : « CI analysis while Automatic Analysis is enabled ».

sonar.organization=thephenix974
sonar.projectKey=ThePheniX974_arboris
sonar.projectName=Arboris

# Uniquement le code app — pas cli/scripts/packages/skills
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.{test,spec}.{ts,tsx}

sonar.inclusions=**/*.{ts,tsx,css}

sonar.exclusions=\
**/node_modules/**,\
**/*.{test,spec}.{ts,tsx},\
**/generated/**

sonar.coverage.exclusions=\
**/*.{test,spec}.{ts,tsx},\
**/generated/**,\
**/routes/**,\
**/router.tsx,\
**/fonts.ts,\
**/test/**,\
**/lib/i18n.tsx,\
**/lib/auth.ts,\
**/lib/agent-logos.ts,\
**/lib/publisher-logos.ts,\
**/lib/collections-data.ts,\
**/lib/font-preload.ts,\
**/components/NvidiaLogo.tsx,\
**/components/Footer.tsx,\
**/server/db.ts,\
**/server/session.ts,\
**/server/functions.ts,\
**/server/auth.functions.ts,\
**/server/admin.functions.ts,\
**/components/DevtoolsPanel.tsx,\
**/components/DevtoolsGate.tsx,\
**/components/HomeTerminal.tsx,\
**/components/ui/shimmer-button.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
